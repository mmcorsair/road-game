<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d2330">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Road Crossing">
<title>Road Crossing</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="hud">
  <span id="level">Level 1</span>
  <span id="score">Score 0</span>
  <span id="lives"></span>
  <span id="hiscore">Hi 0</span>
</div>
<div id="stage">
  <canvas id="game"></canvas>
  <!-- On-screen controls, shown on touch devices. &#xFE0E; keeps the arrows from turning into emoji. -->
  <div id="controls">
    <div class="pad" id="pad-left">
      <button class="btn" data-dir="left" tabindex="-1" aria-label="Left">&#x25C0;&#xFE0E;</button>
      <button class="btn" data-dir="right" tabindex="-1" aria-label="Right">&#x25B6;&#xFE0E;</button>
    </div>
    <div class="pad" id="pad-center">
      <button class="btn small" id="pauseBtn" tabindex="-1" aria-label="Pause">&#x23F8;&#xFE0E;</button>
      <button class="btn small" id="muteBtn" tabindex="-1" aria-label="Sound on/off">🔊</button>
      <button class="btn small" id="fullscreenBtn" tabindex="-1" aria-label="Fullscreen" hidden>&#x26F6;</button>
      <button class="btn small" id="skinsBtn" tabindex="-1" aria-label="Skins">👕</button>
    </div>
    <div class="pad" id="pad-right">
      <button class="btn" data-dir="up" tabindex="-1" aria-label="Up">&#x25B2;&#xFE0E;</button>
      <button class="btn" data-dir="down" tabindex="-1" aria-label="Down">&#x25BC;&#xFE0E;</button>
    </div>
  </div>
</div>
<div id="help">
  <span class="kb-help">Arrows / WASD — move &nbsp;·&nbsp; Space — start &nbsp;·&nbsp; P — pause &nbsp;·&nbsp; M — sound: <span id="sound">on</span> &nbsp;·&nbsp; <button id="skinsLink" class="link" tabindex="-1">👕 K — skins</button></span>
  <span class="touch-help">Tap to start &nbsp;·&nbsp; hold the arrows or drag on the road to move</span>
</div>

<div id="skins" hidden>
  <div class="skins-box" role="dialog" aria-label="Choose a skin">
    <div class="skins-head"><strong>Skins</strong><button id="skinsClose" class="link" tabindex="-1" aria-label="Close">✕</button></div>
    <div id="skinGrid"></div>
    <p class="skins-note">Unlock more by reaching higher scores.</p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/sound.js"></script>
<script src="js/effects.js"></script>
<script src="js/traffic.js"></script>
<script src="js/rail.js"></script>
<script src="js/lanechange.js"></script>
<script src="js/player.js"></script>
<script src="js/pickups.js"></script>
<script src="js/skins.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
