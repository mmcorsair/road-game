<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road Crossing</title>
<style>
  :root { --w: min(480px, 95vw, calc((100vh - 110px) * 0.75)); }
  html, body { margin: 0; height: 100%; background: #1d2330; color: #eee;
               font-family: system-ui, -apple-system, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  #hud { display: flex; justify-content: space-between; width: var(--w); font-size: 18px; }
  canvas { width: var(--w); aspect-ratio: 3 / 4; border-radius: 8px;
           box-shadow: 0 8px 30px rgba(0, 0, 0, .5); touch-action: none; }
  #help { font-size: 13px; opacity: .7; text-align: center; }
</style>
</head>
<body>
<div id="hud">
  <span id="level">Level 1</span>
  <span id="lives"></span>
  <span id="best">Best: 1</span>
</div>
<canvas id="game"></canvas>
<div id="help">↑ / ↓ — move &nbsp;·&nbsp; Space — start &nbsp;·&nbsp; P — pause &nbsp;·&nbsp; M — sound: <span id="sound">on</span></div>

<script>
// ---------- Layout & tuning ----------
const W = 480, H = 640;
const FINISH_H = 64, START_H = 64, LANE_H = 48, MEDIAN_H = 32, LANES_PER_SIDE = 5;
const MEDIAN_Y = FINISH_H + LANES_PER_SIDE * LANE_H;          // top of the median strip
const PLAYER_SPEED = 150, PLAYER_SIZE = 22, START_LIVES = 3;
const REVERSE_MIN = 6, REVERSE_MAX = 12;  // seconds between direction changes of a reversible lane
const MIN_WARNING = 2;                    // a reversing lane blinks at least this long before flipping
const FOLLOW_DIST = 60, ACCEL = 150, BRAKE = 400;  // car-following: keep distance, accelerate, brake (px, px/s²)
const BIKE_LEVEL = 2;                     // motorbikes appear from this level
const EMERGENCY_LEVEL = 3;                // emergency vehicles appear from this level
const EMERGENCY_MIN = 10, EMERGENCY_MAX = 18;  // seconds between emergency vehicles
const EMERGENCY_WARN = 2.5;               // siren + flashing warning this long before it enters
const CAR_COLORS =['#e74c3c', '#3498db', '#f1c40f', '#9b59b6', '#1abc9c', '#e67e22', '#ecf0f1', '#2ecc71'];

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const dpr = window.devicePixelRatio || 1;
canvas.width = W * dpr;
canvas.height = H * dpr;
ctx.scale(dpr, dpr);

const rand = (a, b) => a + Math.random() * (b - a);

// ---------- Game state ----------
let level = 1, lives = START_LIVES, best = loadBest();
let lanes = [], player, state = 'title', stateTimer = 0;
let emergencyTimer = 0, stopSiren = () => {};
const keys = { up: false, down: false };

function loadBest() {
  try { return Number(localStorage.getItem('roadCrossingBest')) || 1; } catch { return 1; }
}
function saveBest() {
  best = Math.max(best, level);
  try { localStorage.setItem('roadCrossingBest', best); } catch {}
}

// ---------- Sound (synthesized with Web Audio, no files needed) ----------
const sound = {
  ctx: null, master: null, noise: null,
  muted: (() => { try { return localStorage.getItem('roadCrossingMuted') === '1'; } catch { return false; } })(),

  // Browsers only allow audio to start after a user gesture, so this is called from input handlers.
  init() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended' && state !== 'paused') this.ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : 0.5;
    this.master.connect(this.ctx.destination);
    // One second of white noise, reused for footsteps and crashes.
    this.noise = this.ctx.createBuffer(1, this.ctx.sampleRate, this.ctx.sampleRate);
    const data = this.noise.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  },

  ready() { return this.ctx && !this.muted; },

  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    try { localStorage.setItem('roadCrossingMuted', this.muted ? '1' : '0'); } catch {}
    updateHud();
  },

  output(node, pan) {
    if (pan && this.ctx.createStereoPanner) {
      const p = this.ctx.createStereoPanner();
      p.pan.value = Math.max(-1, Math.min(1, pan));
      node.connect(p);
      p.connect(this.master);
    } else {
      node.connect(this.master);
    }
  },
};

function tone(freq, dur, { type = 'square', gain = 0.2, endFreq = freq, delay = 0, hold = 0, pan = 0 } = {}) {
  if (!sound.ready()) return;
  const ac = sound.ctx, t = ac.currentTime + delay;
  const osc = ac.createOscillator(), g = ac.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (endFreq !== freq) osc.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
  g.gain.setValueAtTime(gain, t);
  g.gain.setValueAtTime(gain, t + hold);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(g);
  sound.output(g, pan);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}

function noiseBurst(dur, { gain = 0.3, freq = 1000, endFreq = freq, delay = 0 } = {}) {
  if (!sound.ready()) return;
  const ac = sound.ctx, t = ac.currentTime + delay;
  const src = ac.createBufferSource(), filter = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = sound.noise;
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(freq, t);
  if (endFreq !== freq) filter.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(filter);
  filter.connect(g);
  sound.output(g);
  src.start(t, Math.random() * 0.4);
  src.stop(t + dur + 0.02);
}

const sfx = {
  step()  { noiseBurst(0.05, { gain: 0.12, freq: 900 }); },
  start() {
    tone(660, 0.12, { type: 'triangle', gain: 0.2 });
    tone(990, 0.18, { type: 'triangle', gain: 0.2, delay: 0.1 });
  },
  honk(pan) {
    tone(392, 0.4, { gain: 0.05, hold: 0.28, pan });
    tone(494, 0.4, { gain: 0.05, hold: 0.28, pan });
  },
  warn() {
    tone(880, 0.09, { type: 'sine', gain: 0.12 });
    tone(880, 0.09, { type: 'sine', gain: 0.12, delay: 0.16 });
  },
  crash() {
    tone(1300, 0.2, { type: 'sawtooth', gain: 0.05, endFreq: 800 });  // tyre screech
    noiseBurst(0.7, { gain: 0.5, freq: 4000, endFreq: 150, delay: 0.08 });
    tone(140, 0.45, { gain: 0.25, endFreq: 40, delay: 0.08 });       // thud
  },
  levelUp() {
    [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.28, { type: 'triangle', gain: 0.22, delay: i * 0.11 }));
  },
  // Wailing siren that swells during the warning, then pans across as the vehicle passes.
  // Returns a function that stops it early.
  siren(dur, panFrom) {
    if (!sound.ready()) return () => {};
    const ac = sound.ctx, t = ac.currentTime;
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = 'triangle';
    for (let s = 0; s < dur; s += 0.7) {
      osc.frequency.setValueAtTime(950, t + s);
      osc.frequency.setValueAtTime(700, t + s + 0.35);
    }
    g.gain.setValueAtTime(0.02, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + EMERGENCY_WARN);
    g.gain.setValueAtTime(0.12, t + dur - 0.6);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(g);
    if (ac.createStereoPanner) {
      const p = ac.createStereoPanner();
      p.pan.setValueAtTime(panFrom, t + EMERGENCY_WARN);
      p.pan.linearRampToValueAtTime(-panFrom, t + dur);
      g.connect(p);
      p.connect(sound.master);
    } else {
      g.connect(sound.master);
    }
    osc.start(t);
    osc.stop(t + dur);
    return () => { try { osc.stop(); } catch {} };
  },
  gameOver() {
    [392, 330, 262, 196].forEach((f, i) => tone(f, 0.45, { type: 'triangle', gain: 0.22, delay: i * 0.22 }));
  },
};

// ---------- Lanes & vehicles ----------
function pickGap() {
  const base = Math.max(120, 250 - level * 15);
  return rand(base, base * 2.2);
}

function pickKind() {
  const r = Math.random();
  if (level >= BIKE_LEVEL && r < 0.15) return 'bike';
  if (r > 0.8) return 'truck';
  return 'car';
}

// Vehicle sizes and speeds (speed is relative to the lane's base speed).
const VEHICLES = {
  car:       () => ({ w: rand(54, 70), h: 28, speed: rand(0.85, 1.15) }),
  truck:     () => ({ w: rand(95, 125), h: 34, speed: 0.8 }),
  bike:      () => ({ w: 30, h: 14, speed: 1.6 }),
  emergency: () => ({ w: 74, h: 30, speed: 2.2 }),
};

function spawnVehicle(lane, kind) {
  const spec = VEHICLES[kind]();
  const speed = kind === 'emergency' ? Math.max(260, lane.speed * spec.speed) : lane.speed * spec.speed;
  const c = {
    kind, w: spec.w, h: spec.h, speed, v: speed, braking: false,
    x: lane.dir > 0 ? -spec.w / 2 : W + spec.w / 2,
    color: CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)],
  };
  lane.cars.push(c);
  return c;
}

function buildLanes() {
  silenceSiren();
  lanes = [];
  emergencyTimer = rand(EMERGENCY_MIN, EMERGENCY_MAX) / 2;
  const speedMul = 1 + 0.18 * (level - 1);
  for (let i = 0; i < LANES_PER_SIDE * 2; i++) {
    const top = i < LANES_PER_SIDE;
    const y = top
      ? FINISH_H + i * LANE_H + LANE_H / 2
      : MEDIAN_Y + MEDIAN_H + (i - LANES_PER_SIDE) * LANE_H + LANE_H / 2;
    // Right-hand traffic seen from above: upper half drives left, lower half drives right.
    lanes.push({ y, dir: top ? -1 : 1, speed: rand(70, 150) * speedMul, cars: [], nextGap: pickGap(),
                 reversible: false, switchTimer: 0, draining: false, drainTime: 0, emergency: null });
  }
  // A few random lanes periodically reverse direction; more of them on higher levels.
  const reversibleCount = Math.min(1 + Math.floor((level - 1) / 2), 4);
  const shuffled = [...lanes].sort(() => Math.random() - 0.5);
  for (const lane of shuffled.slice(0, reversibleCount)) {
    lane.reversible = true;
    lane.switchTimer = rand(REVERSE_MIN, REVERSE_MAX);
  }
  // Pre-simulate so the road is already full of traffic.
  for (const lane of lanes) for (let t = 0; t < 30; t += 0.05) updateLane(lane, 0.05);
}

// Moves vehicles front to back; each one keeps its own speed but brakes behind a slower vehicle.
function moveVehicles(lane, dt) {
  for (let i = 0; i < lane.cars.length; i++) {
    const c = lane.cars[i], ahead = lane.cars[i - 1];   // cars[] is in spawn order: index 0 is in front
    const gapTo = () => (ahead.x - c.x) * lane.dir - (ahead.w + c.w) / 2;
    let target = c.speed;
    if (ahead) {
      const gap = gapTo();
      if (gap < FOLLOW_DIST) target = Math.min(target, Math.max(0, ahead.v + (gap - FOLLOW_DIST) * 2));
    }
    c.braking = target < c.v - 5;
    c.v = target > c.v ? Math.min(target, c.v + ACCEL * dt) : Math.max(target, c.v - BRAKE * dt);
    c.x += lane.dir * c.v * dt;
    if (ahead && gapTo() < 2) {                          // never drive through the vehicle ahead
      c.x = ahead.x - lane.dir * ((ahead.w + c.w) / 2 + 2);
      c.v = Math.min(c.v, ahead.v);
    }
  }
  lane.cars = lane.cars.filter(c => c.x + c.w / 2 > -150 && c.x - c.w / 2 < W + 150);
}

function updateLane(lane, dt) {
  moveVehicles(lane, dt);

  // Reversible lanes: stop letting cars in, wait until the lane is empty, then flip direction.
  if (lane.reversible) {
    if (!lane.draining) {
      lane.switchTimer -= dt;
      if (lane.switchTimer <= 0) {
        lane.draining = true;
        lane.drainTime = 0;
        if (state === 'playing') sfx.warn();
      }
    } else {
      lane.drainTime += dt;
      if (!lane.cars.length && lane.drainTime >= MIN_WARNING) {
        lane.dir *= -1;
        lane.draining = false;
        lane.switchTimer = rand(REVERSE_MIN, REVERSE_MAX);
      }
    }
    if (lane.draining) return;
  }

  // Distance from the entry edge of the screen to the rear of the most recently spawned car.
  const last = lane.cars[lane.cars.length - 1];
  const room = !last ? Infinity
    : lane.dir > 0 ? last.x - last.w / 2 : W - (last.x + last.w / 2);

  // An announced emergency vehicle holds back normal traffic, then enters once there is room.
  if (lane.emergency) {
    lane.emergency.t -= dt;
    if (lane.emergency.t <= 0 && room >= 10) {
      spawnVehicle(lane, 'emergency');
      lane.emergency = null;
      lane.nextGap = pickGap();
    }
    return;
  }

  if (room >= lane.nextGap) {
    spawnVehicle(lane, pickKind());
    lane.nextGap = pickGap();
  }
}

function dispatchEmergency() {
  emergencyTimer = rand(EMERGENCY_MIN, EMERGENCY_MAX);
  const candidates = lanes.filter(l => !l.reversible && !l.emergency);
  if (!candidates.length) return;
  const lane = candidates[Math.floor(Math.random() * candidates.length)];
  lane.emergency = { t: EMERGENCY_WARN };
  const crossTime = (W + 150) / Math.max(260, lane.speed * 2.2);
  stopSiren = sfx.siren(EMERGENCY_WARN + crossTime + 0.5, -lane.dir);
}

function silenceSiren() {
  stopSiren();
  stopSiren = () => {};
}

// ---------- Player ----------
function resetPlayer() {
  player = { x: W / 2, y: H - START_H / 2, facing: -1, walk: 0, lastStep: 0 };
}

// Cars honk once when they are about to run into the player.
function honkAtPlayer() {
  for (const lane of lanes) {
    if (Math.abs(lane.y - player.y) > LANE_H / 2) continue;
    for (const c of lane.cars) {
      const gap = (player.x - c.x) * lane.dir - c.w / 2 - PLAYER_SIZE / 2;  // distance from bumper to player
      if (!c.honked && c.kind !== 'emergency' && gap > 0 && gap < 70) {
        c.honked = true;
        sfx.honk((c.x - W / 2) / (W / 2));
      }
    }
  }
}

function hitsCar() {
  const s = PLAYER_SIZE / 2 - 3;
  for (const lane of lanes) {
    if (Math.abs(lane.y - player.y) > LANE_H) continue;
    for (const c of lane.cars) {
      if (Math.abs(c.x - player.x) < c.w / 2 - 2 + s &&
          Math.abs(lane.y - player.y) < c.h / 2 - 2 + s) return true;
    }
  }
  return false;
}

// ---------- Game flow ----------
function newGame() {
  level = 1;
  lives = START_LIVES;
  buildLanes();
  resetPlayer();
  state = 'playing';
  updateHud();
  sfx.start();
}

function update(dt) {
  switch (state) {
    case 'title':
    case 'gameover':
      lanes.forEach(l => updateLane(l, dt));
      break;

    case 'playing': {
      const dy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
      if (dy) {
        player.y = Math.min(H - START_H / 2, Math.max(FINISH_H / 2, player.y + dy * PLAYER_SPEED * dt));
        player.facing = dy;
        player.walk += dt * 12;
        const step = Math.floor(player.walk / Math.PI);   // one footstep per half walk cycle
        if (step !== player.lastStep) { player.lastStep = step; sfx.step(); }
      }
      lanes.forEach(l => updateLane(l, dt));
      honkAtPlayer();
      if (level >= EMERGENCY_LEVEL && (emergencyTimer -= dt) <= 0) dispatchEmergency();

      if (hitsCar()) {
        lives--;
        updateHud();
        state = 'hit';
        stateTimer = 1.2;
        // Cancel any announced emergency vehicle, since traffic freezes and the siren would be out of sync.
        silenceSiren();
        for (const l of lanes) l.emergency = null;
        sfx.crash();
      } else if (player.y + PLAYER_SIZE / 2 < FINISH_H) {
        state = 'levelup';
        stateTimer = 1.5;
        saveBest();
        silenceSiren();
        sfx.levelUp();
      }
      break;
    }

    case 'hit':                       // traffic freezes briefly after an accident
      stateTimer -= dt;
      if (stateTimer <= 0) {
        if (lives > 0) { resetPlayer(); state = 'playing'; }
        else { state = 'gameover'; saveBest(); updateHud(); sfx.gameOver(); }
      }
      break;

    case 'levelup':
      lanes.forEach(l => updateLane(l, dt));
      stateTimer -= dt;
      if (stateTimer <= 0) {
        level++;
        saveBest();
        buildLanes();
        resetPlayer();
        state = 'playing';
        updateHud();
      }
      break;
  }
}

function updateHud() {
  document.getElementById('level').textContent = `Level ${level}`;
  document.getElementById('lives').textContent = '❤️'.repeat(Math.max(0, lives)) || '💀';
  document.getElementById('best').textContent = `Best: ${best}`;
  document.getElementById('sound').textContent = sound.muted ? 'off' : 'on';
}

// ---------- Drawing ----------
function drawScene() {
  // Finish zone (grass + checkered line)
  ctx.fillStyle = '#3c8d40';
  ctx.fillRect(0, 0, W, FINISH_H);
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.font = 'bold 22px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('FINISH', W / 2, FINISH_H / 2 - 6);
  for (let x = 0; x < W; x += 12) {
    for (let r = 0; r < 2; r++) {
      ctx.fillStyle = ((x / 12 + r) % 2) ? '#111' : '#fff';
      ctx.fillRect(x, FINISH_H - 12 + r * 6, 12, 6);
    }
  }

  // Road surface
  ctx.fillStyle = '#3a3d44';
  ctx.fillRect(0, FINISH_H, W, H - FINISH_H - START_H);

  // Dashed lane separators
  ctx.strokeStyle = 'rgba(255,255,255,.6)';
  ctx.lineWidth = 2;
  ctx.setLineDash([24, 18]);
  for (let k = 1; k < LANES_PER_SIDE; k++) {
    for (const y of [FINISH_H + k * LANE_H, MEDIAN_Y + MEDIAN_H + k * LANE_H]) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
  }
  ctx.setLineDash([]);

  // Median strip with yellow edge lines
  ctx.fillStyle = '#4a7d3a';
  ctx.fillRect(0, MEDIAN_Y, W, MEDIAN_H);
  ctx.fillStyle = '#f4d03f';
  ctx.fillRect(0, MEDIAN_Y, W, 3);
  ctx.fillRect(0, MEDIAN_Y + MEDIAN_H - 3, W, 3);

  // Start sidewalk with tiles
  ctx.fillStyle = '#9aa0a6';
  ctx.fillRect(0, H - START_H, W, START_H);
  ctx.strokeStyle = 'rgba(0,0,0,.15)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 32) {
    ctx.beginPath(); ctx.moveTo(x, H - START_H); ctx.lineTo(x, H); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(0, H - START_H / 2); ctx.lineTo(W, H - START_H / 2); ctx.stroke();
  ctx.fillStyle = '#ddd';
  ctx.fillRect(0, H - START_H, W, 4);   // curb
}

// Reversible lanes get an amber tint and painted arrows showing the traffic direction.
// While a lane is about to reverse, the arrows blink amber and point the new way.
function drawReversibleLanes(now) {
  for (const lane of lanes) {
    if (!lane.reversible) continue;
    ctx.fillStyle = 'rgba(244,180,0,.10)';
    ctx.fillRect(0, lane.y - LANE_H / 2, W, LANE_H);

    let dir = lane.dir, color = 'rgba(255,255,255,.35)';
    if (lane.draining) {
      if (Math.floor(now / 250) % 2) continue;   // blink
      dir = -lane.dir;
      color = '#f4b400';
    }
    ctx.fillStyle = color;
    for (const x of [W * 0.15, W * 0.5, W * 0.85]) {
      ctx.save();
      ctx.translate(x, lane.y);
      ctx.scale(dir, 1);
      ctx.beginPath();
      ctx.moveTo(14, 0);
      ctx.lineTo(2, -9);
      ctx.lineTo(2, -4);
      ctx.lineTo(-14, -4);
      ctx.lineTo(-14, 4);
      ctx.lineTo(2, 4);
      ctx.lineTo(2, 9);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }
}

function drawCar(c, y, dir, now) {
  const { w, h } = c;
  ctx.save();
  ctx.translate(c.x, y);
  if (dir < 0) ctx.scale(-1, 1);       // after this, the vehicle's front always points to +x

  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.roundRect(-w / 2 + 3, -h / 2 + 3, w, h, 6); ctx.fill();

  if (c.kind === 'bike') {
    ctx.fillStyle = '#222';             // tyres, seen from above as one long strip
    ctx.beginPath(); ctx.roundRect(-w / 2, -2, w, 4, 2); ctx.fill();
    ctx.fillStyle = c.color;            // tank and seat
    ctx.beginPath(); ctx.roundRect(-w / 2 + 6, -4, w - 12, 8, 3); ctx.fill();
    ctx.fillStyle = '#111';             // handlebar
    ctx.fillRect(w / 2 - 9, -7, 2, 14);
    ctx.fillStyle = '#333';             // rider's shoulders
    ctx.beginPath(); ctx.ellipse(-2, 0, 5, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f5f5f5';          // helmet
    ctx.beginPath(); ctx.arc(1, 0, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff6a8';
    ctx.fillRect(w / 2 - 2, -1.5, 2, 3);
    ctx.fillStyle = c.braking ? '#ff1a1a' : '#a01010';
    ctx.fillRect(-w / 2, -1.5, c.braking ? 3 : 2, 3);
    ctx.restore();
    return;
  }

  if (c.kind === 'truck') {
    ctx.fillStyle = '#d0d4d9';          // cargo box
    ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w - 30, h, 3); ctx.fill();
    ctx.fillStyle = c.color;            // cab
    ctx.beginPath(); ctx.roundRect(w / 2 - 28, -h / 2 + 2, 28, h - 4, 6); ctx.fill();
    ctx.fillStyle = '#1b2733';
    ctx.beginPath(); ctx.roundRect(w / 2 - 12, -h / 2 + 5, 7, h - 10, 2); ctx.fill();
  } else {
    const emergency = c.kind === 'emergency';
    ctx.fillStyle = emergency ? '#f8f8f8' : c.color;
    ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 7); ctx.fill();
    if (emergency) {
      ctx.fillStyle = '#e02020';        // red stripes along the sides
      ctx.fillRect(-w / 2 + 4, -h / 2 + 1, w - 10, 3);
      ctx.fillRect(-w / 2 + 4, h / 2 - 4, w - 10, 3);
    }
    ctx.fillStyle = '#1b2733';          // windshield & rear window
    ctx.beginPath(); ctx.roundRect(w / 2 - 24, -h / 2 + 4, 9, h - 8, 3); ctx.fill();
    ctx.beginPath(); ctx.roundRect(-w / 2 + 7, -h / 2 + 5, 7, h - 10, 3); ctx.fill();
    if (emergency) {
      const flip = Math.floor(now / 120) % 2;   // alternating light bar on the roof
      ctx.fillStyle = flip ? '#ff2a2a' : '#5a1010';
      ctx.fillRect(w / 2 - 34, -h / 2 + 4, 6, h / 2 - 4);
      ctx.fillStyle = flip ? '#10205a' : '#2a6bff';
      ctx.fillRect(w / 2 - 34, 0, 6, h / 2 - 4);
    } else {
      ctx.fillStyle = 'rgba(255,255,255,.15)'; // roof highlight
      ctx.beginPath(); ctx.roundRect(-w / 2 + 16, -h / 2 + 5, w - 42, h - 10, 4); ctx.fill();
    }
  }

  ctx.fillStyle = '#fff6a8';            // headlights
  ctx.fillRect(w / 2 - 3, -h / 2 + 3, 3, 6);
  ctx.fillRect(w / 2 - 3, h / 2 - 9, 3, 6);
  if (c.braking) {                      // brake lights glow when slowing down
    ctx.fillStyle = 'rgba(255,40,40,.35)';
    ctx.fillRect(-w / 2 - 4, -h / 2 + 1, 5, 10);
    ctx.fillRect(-w / 2 - 4, h / 2 - 11, 5, 10);
  }
  ctx.fillStyle = c.braking ? '#ff1a1a' : '#b81c1c';   // tail lights
  ctx.fillRect(-w / 2, -h / 2 + 3, c.braking ? 3 : 2, 6);
  ctx.fillRect(-w / 2, h / 2 - 9, c.braking ? 3 : 2, 6);
  ctx.restore();
}

// Flashing red/blue warning at the edge where an announced emergency vehicle will enter.
function drawEmergencyWarnings(now) {
  for (const lane of lanes) {
    if (!lane.emergency) continue;
    const red = Math.floor(now / 150) % 2;
    const x = lane.dir > 0 ? 16 : W - 16;
    ctx.save();
    ctx.translate(x, lane.y);
    ctx.scale(lane.dir, 1);
    ctx.fillStyle = red ? 'rgba(255,40,40,.35)' : 'rgba(40,100,255,.35)';
    ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = red ? '#ff3030' : '#3a7bff';
    ctx.beginPath();                    // chevron pointing into the road
    ctx.moveTo(10, 0); ctx.lineTo(-4, -10); ctx.lineTo(-4, 10); ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

function drawPlayer() {
  ctx.save();
  ctx.translate(player.x, player.y);
  if (state === 'hit') ctx.rotate((1.2 - stateTimer) * 10);   // spin after being bumped
  else if (player.facing > 0) ctx.rotate(Math.PI);           // sprite is drawn facing up

  const swing = Math.sin(player.walk) * 5;
  const ellipse = (x, y, rx, ry, color) => {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  };
  ellipse(-5, swing, 3.5, 6, '#2c3e50');       // feet
  ellipse(5, -swing, 3.5, 6, '#2c3e50');
  ellipse(-11, -swing * 0.8, 3, 3, '#f0c08a'); // hands
  ellipse(11, swing * 0.8, 3, 3, '#f0c08a');
  ellipse(0, 0, 11, 7, '#e67e22');             // shoulders / shirt
  ellipse(0, -1, 5.5, 5.5, '#f0c08a');         // head (face toward the front)
  ellipse(0, 0.5, 5.5, 4.5, '#6b4226');        // hair
  ctx.restore();

  if (state === 'hit') {
    ctx.fillStyle = `rgba(255,60,60,${stateTimer / 2})`;
    ctx.beginPath(); ctx.arc(player.x, player.y, 30, 0, Math.PI * 2); ctx.fill();
  }
}

function overlay(title, sub) {
  ctx.fillStyle = 'rgba(0,0,0,.6)';
  ctx.fillRect(0, H / 2 - 70, W, 140);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 34px system-ui, sans-serif';
  ctx.fillText(title, W / 2, H / 2 - 18);
  ctx.font = '16px system-ui, sans-serif';
  ctx.fillText(sub, W / 2, H / 2 + 24);
}

function nextLevelHint() {
  if (level + 1 === BIKE_LEVEL) return 'Next: watch out for fast motorbikes!';
  if (level + 1 === EMERGENCY_LEVEL) return 'Next: listen for sirens — emergency vehicles!';
  return 'Faster traffic, more reversing lanes…';
}

function draw() {
  drawScene();
  const now = performance.now();
  drawReversibleLanes(now);
  for (const lane of lanes) for (const c of lane.cars) drawCar(c, lane.y, lane.dir, now);
  drawEmergencyWarnings(now);
  if (state !== 'title') drawPlayer();

  if (state === 'title') overlay('Road Crossing', 'Press Space (or tap) to start');
  else if (state === 'paused') overlay('Paused', 'Press P to continue');
  else if (state === 'levelup') overlay(`Level ${level} complete!`, nextLevelHint());
  else if (state === 'gameover') overlay('Game Over', `You reached level ${level} · Space to play again`);
  else if (state === 'hit' && lives > 0) overlay('Ouch!', `${lives} ${lives === 1 ? 'life' : 'lives'} left`);
}

// ---------- Input ----------
function setKey(e, down) {
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = down;
  else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = down;
  else return false;
  return true;
}

addEventListener('keydown', e => {
  sound.init();
  if (setKey(e, true) || e.key === ' ') e.preventDefault();
  if (e.key === 'm' || e.key === 'M') sound.toggleMute();
  if ((e.key === ' ' || e.key === 'Enter') && (state === 'title' || state === 'gameover')) newGame();
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
    if (state === 'playing') setPaused(true);
    else if (state === 'paused') setPaused(false);
  }
});
addEventListener('keyup', e => setKey(e, false));
addEventListener('blur', () => {
  keys.up = keys.down = false;
  if (state === 'playing') setPaused(true);
});

// Pausing also suspends audio, so a siren picks up exactly where it left off.
function setPaused(on) {
  state = on ? 'paused' : 'playing';
  if (sound.ctx) on ? sound.ctx.suspend() : sound.ctx.resume();
}

// Touch / mouse: hold above the man to walk up, below him to walk down.
canvas.addEventListener('pointerdown', e => {
  sound.init();
  if (state === 'title' || state === 'gameover') { newGame(); return; }
  if (state === 'paused') { setPaused(false); return; }
  const rect = canvas.getBoundingClientRect();
  const y = (e.clientY - rect.top) * (H / rect.height);
  keys.up = y < player.y;
  keys.down = !keys.up;
});
addEventListener('pointerup', () => { keys.up = keys.down = false; });

// ---------- Main loop ----------
buildLanes();
resetPlayer();
updateHud();

let lastTime = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);   // clamp so a background tab doesn't teleport cars
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
