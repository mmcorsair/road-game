# Runs the game's test page (tests.html) in headless Chrome on every push and pull request.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run tests in headless Chrome
        run: tests/run.sh
        env:
          CHROME: google-chrome           # preinstalled on GitHub's Ubuntu runners
          CHROME_FLAGS: --no-sandbox      # Chrome's sandbox can't start on the runner
